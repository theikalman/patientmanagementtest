# ---------------------------------------------------------------------------
# The whole application, built and run as it would actually be deployed:
#
#     docker compose up -d --build        # or: make stack-up
#
# The back end as a jar on a JRE, the front end as a static bundle served by
# nginx, with nginx proxying /api to the back end so the browser sees a single
# origin. Use it to confirm the thing builds and works outside a developer's
# machine - a smoke test or a last check before opening a pull request - not as
# the daily loop. Day to day, run both from source with `make dev`, where
# restarts and a debugger work.
#
# Swagger UI is not a service here: the back end serves it itself at
# /swagger-ui.html, so a separate container would only be a second copy to keep
# in step.
# ---------------------------------------------------------------------------
name: patient-management

services:

  backend:
    build:
      context: ./backend
    image: patient-management/backend:local
    container_name: patient-backend
    ports:
      # Published so curl and any API tool can reach the service directly. The
      # front end does NOT use this: it proxies over the internal network.
      - "8080:8080"
    environment:
      # Seeded demo data, which is what makes a sanity check worth looking at.
      SPRING_PROFILES_ACTIVE: demo
      JAVA_OPTS: -XX:MaxRAMPercentage=75
      # No CORS origins are set: the front end reaches the API through the nginx
      # proxy below, so every browser request is same origin.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: patient-management/frontend:local
    container_name: patient-frontend
    ports:
      # Host 4200 so the URL matches the dev server and nothing has to be
      # relearned between the two ways of running this.
      - "4200:80"
    depends_on:
      backend:
        # Wait for the API to answer, not merely to exist: nginx resolves
        # "backend" at startup, and a container that is up but still migrating
        # the database would give the first page load a 502.
        condition: service_healthy
    restart: unless-stopped
