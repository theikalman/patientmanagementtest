# Production shaped profile.
#
# Kept in the repository to show the intended deployment posture even though the
# assessment only ever runs the demo profile: a real database from the
# environment, no seed data, no H2 console, no Swagger UI, same origin front end.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  h2:
    console:
      enabled: false
  flyway:
    locations: classpath:db/migration
  jpa:
    properties:
      hibernate:
        format_sql: false

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    com.xtramile.patient: INFO
    org.hibernate.SQL: WARN
