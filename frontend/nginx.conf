# ---------------------------------------------------------------------------
# Serves the built Angular bundle and proxies the API.
#
# The proxy is the important part: the browser only ever talks to this one
# origin, so there is no CORS in the containerised stack at all. That is also
# the production posture described in the README - the two applications behind
# a single origin - which is what makes this stack a meaningful sanity check
# rather than a different system wearing the same name.
# ---------------------------------------------------------------------------

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # The Angular bundle is mostly text and compresses very well.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # Modest hardening. Not a substitute for a real gateway, but free.
    add_header X-Content-Type-Options nosniff  always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        no-referrer-when-downgrade always;

    # API calls go to the back end container by service name. Docker's embedded
    # DNS resolves "backend"; there is no need for a fixed IP or a link.
    # No trailing slash on proxy_pass, so the /api prefix is preserved.
    # $http_host, NOT $host. $host drops the port, so the back end would see
    # "Host: localhost" while the browser sends "Origin: http://localhost:4200".
    # Spring then decides the two differ, treats a same-origin write as a CORS
    # request and answers 403 "Invalid CORS request". Browsers attach Origin to
    # every PUT/POST/DELETE, including same-origin ones, so this breaks exactly
    # the write path and leaves reads working, which is a confusing way to fail.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Handy on one origin while poking around: the raw OpenAPI document and the
    # bundled Swagger UI, without needing the back end's published port.
    location /v3/api-docs {
        proxy_pass       http://backend:8080;
        proxy_set_header Host $http_host;
    }

    location ~ ^/(swagger-ui|actuator) {
        proxy_pass       http://backend:8080;
        proxy_set_header Host $http_host;
    }

    # Hashed build artefacts are immutable, so let the browser keep them.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers loading the
    # previous bundle's script names, which are gone.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Angular owns client side routing: /patients/44/edit is a route, not a file,
    # so anything unmatched falls through to index.html rather than returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
